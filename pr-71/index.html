<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- iPhone Safari has no element fullscreen; launching from the Home Screen
       as a web app is the only way to lose the browser UI there (#56). -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="X-76">
  <meta name="theme-color" content="#000000">
  <title>X-76</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <!-- Back to front: background, 3D layer, sprites + HUD (see main.js). -->
    <canvas id="back" width="384" height="240"></canvas>
    <canvas id="screen3d"></canvas>
    <canvas id="screen" width="384" height="240"></canvas>
  </div>
  <div id="rotateHint">ROTATE YOUR DEVICE<br>FOR THE BEST EXPERIENCE</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
